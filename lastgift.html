    <!-- Balloon Animation -->
 <script>
/* BALLOONS - LAPTOP + MOBILE */
.balloon {
    position: fixed;
    bottom: -100px;
    font-size: 40px;
    z-index: 9999;
    pointer-events: none;
    animation: balloonUp 6s linear forwards;
    will-change: transform, opacity;
}

/* BALLOON MOVEMENT */
@keyframes balloonUp {
    0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform: translate3d(0, -120vh, 0) rotate(25deg);
        opacity: 0;
    }
}

/* MOBILE SUPPORT */
@media screen and (max-width: 768px) {
    .balloon {
        position: fixed;
        font-size: 32px;
        z-index: 9999;
        animation: balloonUp 6s linear forwards;
    }
}
</script>
