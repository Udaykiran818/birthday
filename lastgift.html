    <!-- Balloon Animation -->
 <script>

/* BALLOONS - LAPTOP + MOBILE */
.balloon {
    position: fixed;
    left: 0;
    bottom: -80px;
    font-size: 38px;
    z-index: 99999;
    pointer-events: none;
    user-select: none;
    will-change: transform;
    animation: balloonUp 6s linear forwards;
}

/* BALLOON ANIMATION */
@keyframes balloonUp {
    0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform: translate3d(0, -120vh, 0) rotate(25deg);
        opacity: 0;
    }
}

/* MOBILE */
@media screen and (max-width: 768px) {
    .balloon {
        font-size: 30px;
        animation-duration: 6s;
    }
}

/* REDUCE ANIMATION IF DEVICE REQUESTS IT */
@media (prefers-reduced-motion: reduce) {
    .balloon {
        animation-duration: 6s;
    }
}
