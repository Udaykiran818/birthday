<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday ❤️</title>
</head>

<body style="
    background-color: #000000;
    text-align: center;
    color: #FFFFFF;
    margin: 0;
    padding: 40px;
    min-height: 100vh;
">

    <!-- Birthday Heading -->
    <h1 style="
        font-family: Georgia, serif;
        font-weight: bold;
        font-size: 58px;
        color: #FFFFFF;
        margin-top: 30px;
        text-shadow: 0 0 8px #FFFFFF, 0 0 15px #FFFFFF;
    ">
        HAPPY BIRTHDAY ❤️
    </h1>

    <!-- Friend Name -->
    <h2 style="
        font-family: 'Paul Jackson', cursive;
        font-size: 35px;
        color: #FFFFFF;
        text-shadow: 0 0 2px #FFFFFF, 0 0 14px #FFFFFF;
    ">
        Sudheeruuu
    </h2>

    <!-- Birthday Message -->
<p id="birthdayText" style="
    font-family: Georgia, serif;
    font-size: 20px;
    line-height: 1.8;
    color: #FFFFFF;
    text-shadow: 0 0 2px #FFFFFF, 0 0 12px #FFFFFF;
    min-height: 75px;
"></p>

<script>
    const text = "Your a wonderful and My favorite friend";
    const text2 = "Thank you for being with meee 🥹💖";

    const element = document.getElementById("birthdayText");

    let i = 0;

    function typeText() {
        if (i < text.length) {
            element.innerHTML += text.charAt(i);
            i++;
            setTimeout(typeText, 70);
        } else {
            element.innerHTML += "<br>";
            i = 0;
            typeText2();
        }
    }

    function typeText2() {
        if (i < text2.length) {
            element.innerHTML += text2.charAt(i);
            i++;
            setTimeout(typeText2, 70);
        }
    }

    typeText();
</script>

    <!-- Us Together -->
    <a href="together.html" style="
        text-decoration: none;
        color: #FFFFFF;
    ">

        <h2 style="
            font-family: Georgia, serif;
            font-size: 30px;
            color: #FFFFFF;
            margin-top: 60px;
            cursor: pointer;
            text-shadow: 0 0 2px #FFFFFF, 0 0 14px #FFFFFF;
        ">
            Us Together 🫂
        </h2>

        <p style="
            font-size: 18px;
            color: #FFFFFF;
            cursor: pointer;
            text-shadow: 0 0 2px #FFFFFF, 0 0 12px #FFFFFF;
        ">
            <br>
            <small>Click here 🙈</small>
        </p>

    </a>

</body>

</html>
