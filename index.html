
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❤️</title>

    <!-- CSS File Link -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Birthday Heading -->
    <h1>HAPPY BIRTHDAY ❤️</h1>

    <!-- Friend Name -->
    <h2 class="friend-name">Sudheeruuu</h2>

    <!-- Birthday Message -->
    <p id="birthdayText"></p>

    <!-- Typing Animation -->
    <script>
        const text = "Your a wonderful and My favorite friend";
        const text2 = "Thank you for being with meee 🥹💖";

        const element = document.getElementById("birthdayText");

        let i = 0;

        function typeText() {
            if (i < text.length) {
                element.innerHTML += text.charAt(i);
                i++;
                setTimeout(typeText, 70);
            } else {
                element.innerHTML += "<br>";
                i = 0;
                typeText2();
            }
        }

        function typeText2() {
            if (i < text2.length) {
                element.innerHTML += text2.charAt(i);
                i++;
                setTimeout(typeText2, 70);
            }
        }

        typeText();
    </script>

    <!-- Us Together -->
    <a href="together.html" class="together-link">

        <h2 class="together-heading">Us Together 🫂</h2>

        <p class="click-text">
            <br>
            <small>Click here 🙈</small>
        </p>

    </a>

</body>
</html>
