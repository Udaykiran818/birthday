```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❤️</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap"
          rel="stylesheet">
</head>

<body>

    <!-- MAIN LAYOUT -->
    <div class="birthday-layout">

        <!-- LEFT SIDE: BIRTHDAY TEXT -->
        <div class="birthday-content">

            <!-- Birthday Heading -->
            <h1>
                <span>HAPPY</span><br>
                <span class="birthday-yellow">BIRTHDAY</span> ❤️
            </h1>

            <!-- Date Box -->
            <div class="name-box">
                <span>23 October 2006</span>
            </div>

            <!-- Friend Name -->
            <h2 class="friend-name">Sudheeruuu</h2>

            <!-- Birthday Message -->
            <p id="birthdayText"></p>

            <!-- Us Together -->
            <a href="together.html" class="together-link">

                <h2 class="together-heading">Us Together 🫂</h2>

                <p class="click-text">
                    <small>Click here 🙈</small>
                </p>

            </a>

        </div>

        <!-- RIGHT SIDE: VIDEO CLIP -->
        <div class="birthday-video">

            <video autoplay muted loop playsinline controls>
                <source src="birthday-video.mp4" type="video/mp4">
                Your browser does not support the video.
            </video>

        </div>

    </div>

    <!-- TYPING ANIMATION -->
    <script>
        const text = "Your a wonderful and My favorite friend";
        const text2 = "Thank you for being with meee 🥹💖";

        const element = document.getElementById("birthdayText");

        let i = 0;

        function typeText() {
            if (i < text.length) {
                element.innerHTML += text.charAt(i);
                i++;
                setTimeout(typeText, 70);
            } else {
                element.innerHTML += "<br>";
                i = 0;
                typeText2();
            }
        }

        function typeText2() {
            if (i < text2.length) {
                element.innerHTML += text2.charAt(i);
                i++;
                setTimeout(typeText2, 70);
            }
        }

        typeText();
    </script>

</body>
</html>
```
