
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❤️</title>

    <!-- CSS File Link -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap"
          rel="stylesheet">

    <!-- Remove Font Glow -->
    <style>
        h1,
        .birthday-yellow,
        .friend-name,
        #birthdayText,
        .together-heading {
            text-shadow: none !important;
        }

        .friend-name {
            color: #FFD700 !important;
            -webkit-text-stroke: 0 !important;
        }

        .together-link {
            display: inline-block;
            margin-top: 15px;
            padding: 5px 14px;
            background: #FFF2B2;
            border: 2px solid #FFD700;
            border-radius: 12px;
            box-shadow: none;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .together-link:hover {
            transform: scale(1.04);
        }

        .together-heading {
            margin: 2px 0;
            padding: 0;
            font-size: 22px;
            color: #222222 !important;
            -webkit-text-stroke: 0 !important;
        }
    </style>
</head>

<body>

    <!-- Birthday Heading -->
    <h1>
        <span>HAPPY</span><br>
        <span class="birthday-yellow">BIRTHDAY</span> ❤️
    </h1>

    <!-- Birthday Date -->
    <div class="name-box">
        <span>23 October 2006</span>
    </div>

    <!-- Friend Name -->
<h2 class="friend-name" style="
    color: #FFD700 !important;
    -webkit-text-stroke: 2px #000000 !important;
    paint-order: stroke fill;
    text-shadow: none !important;
">
    Sudheeruuu
</h2>
    <!-- Birthday Message -->
    <p id="birthdayText"></p>

    <!-- Typing Animation -->
    <script>
        const text = "Your a wonderful and My favorite friend";
        const text2 = "Thank you for being with meee 🥹💖";

        const element = document.getElementById("birthdayText");

        let i = 0;

        function typeText() {
            if (i < text.length) {
                element.innerHTML += text.charAt(i);
                i++;
                setTimeout(typeText, 70);
            } else {
                element.innerHTML += "<br>";
                i = 0;
                typeText2();
            }
        }

        function typeText2() {
            if (i < text2.length) {
                element.innerHTML += text2.charAt(i);
                i++;
                setTimeout(typeText2, 70);
            }
        }

        typeText();
    </script>

    <!-- Us Together Small Yellow Box -->
    <a href="together.html" class="together-link">
        <h2 class="together-heading">
            Us Together 🫂
        </h2>
    </a>

    <!-- Cursor Hearts -->
    <script>
        function createHeart(x, y) {
            const heart = document.createElement("span");
            heart.className = "cursor-heart";

            const symbols = ["❤️", "💕", "💖", "💗", "✨"];

            heart.textContent =
                symbols[Math.floor(Math.random() * symbols.length)];

            heart.style.left = x + "px";
            heart.style.top = y + "px";

            document.body.appendChild(heart);

            setTimeout(function () {
                heart.remove();
            }, 1000);
        }

        document.addEventListener("mousemove", function (e) {
            createHeart(e.clientX, e.clientY);
        });

        document.addEventListener("touchmove", function (e) {
            const touch = e.touches[0];
            createHeart(touch.clientX, touch.clientY);
        }, { passive: true });
    </script>

</body>
</html>
