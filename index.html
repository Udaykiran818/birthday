```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❤️</title>

    <!-- CSS File Link -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap"
          rel="stylesheet">
</head>

<body>

    <!-- Birthday Heading -->
    <h1>
        <span>HAPPY</span><br>
        <span class="birthday-yellow">BIRTHDAY</span> ❤️
    </h1>

    <!-- Birthday Date -->
    <div class="name-box">
        <span>23 October 2006</span>
    </div>

    <!-- Friend Name - Yellow -->
    <h2 class="friend-name"
        style="color: #FFD700;">
        Sudheeruuu
    </h2>

    <!-- Birthday Message -->
    <p id="birthdayText"></p>

    <!-- Typing Animation -->
    <script>
        const text = "Your a wonderful and My favorite friend";
        const text2 = "Thank you for being with meee 🥹💖";

        const element = document.getElementById("birthdayText");

        let i = 0;

        function typeText() {
            if (i < text.length) {
                element.innerHTML += text.charAt(i);
                i++;
                setTimeout(typeText, 70);
            } else {
                element.innerHTML += "<br>";
                i = 0;
                typeText2();
            }
        }

        function typeText2() {
            if (i < text2.length) {
                element.innerHTML += text2.charAt(i);
                i++;
                setTimeout(typeText2, 70);
            }
        }

        typeText();
    </script>

    <!-- Us Together Box -->
    <a href="together.html"
       class="together-link"
       style="
           display: inline-block;
           margin-top: 25px;
           padding: 12px 30px;
           border: 2px solid #FFD700;
           border-radius: 18px;
           background: rgba(0, 0, 0, 0.35);
           box-shadow: 0 0 12px rgba(255, 215, 0, 0.35);
           text-decoration: none;
       ">

        <h2 class="together-heading"
            style="margin: 5px 0; color: #FFD700;">
            Us Together 🫂
        </h2>

    </a>

    <!-- Cursor Hearts -->
    <script>
        function createHeart(x, y) {
            const heart = document.createElement("span");
            heart.className = "cursor-heart";

            const symbols = ["❤️", "💕", "💖", "💗", "✨"];

            heart.textContent =
                symbols[Math.floor(Math.random() * symbols.length)];

            heart.style.left = x + "px";
            heart.style.top = y + "px";

            document.body.appendChild(heart);

            setTimeout(function () {
                heart.remove();
            }, 1000);
        }

        document.addEventListener("mousemove", function (e) {
            createHeart(e.clientX, e.clientY);
        });

        document.addEventListener("touchmove", function (e) {
            const touch = e.touches[0];
            createHeart(touch.clientX, touch.clientY);
        }, { passive: true });
    </script>

</body>
</html>
