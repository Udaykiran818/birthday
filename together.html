
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Us Together 🫂</title>

    <style>
        body {
            background: #000000;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .photo-card {
            position: relative;
            width: 300px;
            max-width: 90%;
            height: 220px;
            margin: 25px auto;
            border: 2px solid #FFD700;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-cover {
            position: absolute;
            inset: 0;
            background: #FFF2B2;
            color: #222222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            transition: opacity 0.5s ease;
        }

        .photo-cover span {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .photo-card.opened .photo-cover {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <h1>Us Together 🫂❤️</h1>
    <p>Touch the cover to see our memory 💛</p>

    <!-- Photo 1 -->
    <div class="photo-card" onclick="openPhoto(this)">
        <img src="uday4.jpeg" alt="Our memory 1">
        <div class="photo-cover">
            <span>💌</span>
            Tap to Reveal 💖
        </div>
    </div>

    <!-- Photo 2 -->
    <div class="photo-card" onclick="openPhoto(this)">
        <img src="uday3 fi.jpeg" alt="Our memory 2">
        <div class="photo-cover">
            <span>💌</span>
            Tap to Reveal 💖
        </div>
    </div>

    <!-- Photo 3 -->
    <div class="photo-card" onclick="openPhoto(this)">
        <img src="uday1.jpeg" alt="Our memory 3">
        <div class="photo-cover">
            <span>💌</span>
            Tap to Reveal 💖
        </div>
    </div>



        <!--photo 5 -->
    <div class="photo-card" onclick="openPhoto(this)">
        <img src="uday.jpeg" alt="Our memory 3">
        <div class="photo-cover">
            <span>💌</span>
            Tap to Reveal 💖
        </div>
    </div>

    <script>
        function openPhoto(card) {
            card.classList.add("opened");
        }
    </script>

</body>
</html>
