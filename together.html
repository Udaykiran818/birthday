
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Us Together 🫂</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap"
          rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="together.css">

    <!-- Surprise Button CSS -->
    <style>
        .surprise-button {
            display: inline-block;
            margin: 50px auto 40px;
            padding: 14px 30px;
            background: #FFF2B2;
            color: #222222;
            border: 3px solid #FFD700;
            border-radius: 15px;
            text-decoration: none;
            font-family: 'Lilita One', cursive;
            font-size: 22px;
            box-shadow: 0 5px 0 #000000;
            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .surprise-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 9px 0 #000000;
        }

        @media screen and (max-width: 600px) {
            .surprise-button {
                margin-top: 35px;
                padding: 12px 24px;
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <h1>Us Together 🫂❤️</h1>

    <p>Open the gift to see our memories 💛</p>

    <!-- Photo 1 -->
    <div class="photo-card" onclick="openPhoto(this)">
        <img src="uday4.jpeg" alt="Our memory 1">

        <div class="photo-cover">
            <span>🎁</span>
            Our Memory ❤️
        </div>

        <div class="gift-lid">🎀</div>
    </div>

    <!-- Photo 2 -->
    <div class="photo-card" onclick="openPhoto(this)">
        <img src="uday3 fi.jpeg" alt="Our memory 2">

        <div class="photo-cover">
            <span>🎁</span>
            Our Memory 💖
        </div>

        <div class="gift-lid">🎀</div>
    </div>

    <!-- Photo 3 -->
    <div class="photo-card" onclick="openPhoto(this)">
        <img src="uday1.jpeg" alt="Our memory 3">

        <div class="photo-cover">
            <span>🎁</span>
            Our Memory 🫂
        </div>

        <div class="gift-lid">🎀</div>
    </div>

    <!-- Photo 4 -->
    <div class="photo-card" onclick="openPhoto(this)">
        <img src="uday.jpeg" alt="Our memory 4">

        <div class="photo-cover">
            <span>🎁</span>
            Our Memory ❤️
        </div>

        <div class="gift-lid">🎀</div>
    </div>

    <!-- Gift Box Animation -->
    <script>
        function openPhoto(card) {
            card.classList.add("opened");
        }
    </script>
       <script>
        function createHeart(x, y) {
            const heart = document.createElement("span");
            heart.className = "cursor-heart";

            const symbols = ["❤️", "💕", "💖", "💗", "✨"];

            heart.textContent =
                symbols[Math.floor(Math.random() * symbols.length)];

            heart.style.left = x + "px";
            heart.style.top = y + "px";

            document.body.appendChild(heart);

            setTimeout(function () {
                heart.remove();
            }, 1000);
        }

        document.addEventListener("mousemove", function (e) {
            createHeart(e.clientX, e.clientY);
        });

        document.addEventListener("touchmove", function (e) {
            const touch = e.touches[0];
            createHeart(touch.clientX, touch.clientY);
        }, { passive: true });
    </script>


    <!-- Surprise Page Button -->
    <a href="surprise.html" class="surprise-button">
        🎁 Open Surprise
    </a>

</body>
</html>
