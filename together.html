
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Us Together 🫂</title>

    <style>
        body {
            background: #000000;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            color: #FFD700;
            text-shadow: none;
            animation: titleEnter 1s ease-out both;
        }

        p {
            color: #FFF2B2;
            animation: titleEnter 1s ease-out 0.2s both;
        }

        /* Photo Box */
        .photo-card {
            position: relative;
            width: 300px;
            max-width: 90%;
            height: 220px;
            margin: 30px auto;
            border: 2px solid #FFD700;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            background: #FFF2B2;

            /* Page opening animation */
            opacity: 0;
            animation: boxEnter 0.9s ease-out forwards;
        }

        /* Each box enters one by one */
        .photo-card:nth-of-type(1) {
            animation-delay: 0.3s;
        }

        .photo-card:nth-of-type(2) {
            animation-delay: 0.6s;
        }

        .photo-card:nth-of-type(3) {
            animation-delay: 0.9s;
        }

        .photo-card:nth-of-type(4) {
            animation-delay: 1.2s;
        }

        /* Photo */
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Main Cover */
        .photo-cover {
            position: absolute;
            inset: 0;
            background: #FFF2B2;
            color: #222222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            z-index: 2;
            transition: opacity 0.4s ease 0.35s;
        }

        .photo-cover span {
            font-size: 45px;
            margin-bottom: 8px;
        }

        /* Gift Box Cap */
        .gift-lid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 48%;
            background: #FFD700;
            border-bottom: 5px solid #B8860B;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            z-index: 3;
            transition: transform 0.8s ease-in,
                        opacity 0.5s ease;
        }

        /* Cap falls down when touched */
        .photo-card.opened .gift-lid {
            transform: translateY(250px) rotate(12deg);
            opacity: 0;
            pointer-events: none;
        }

        /* Cover disappears */
        .photo-card.opened .photo-cover {
            opacity: 0;
            pointer-events: none;
        }

        /* Box entrance */
        @keyframes boxEnter {
            0% {
                opacity: 0;
                transform: translateY(50px) scale(0.8);
            }

            70% {
                opacity: 1;
                transform: translateY(-7px) scale(1.03);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Heading entrance */
        @keyframes titleEnter {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Hover effect */
        .photo-card:hover {
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.45);
        }

        @media (prefers-reduced-motion: reduce) {
            .photo-card,
            h1,
            p {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>

<body>

    <h1>Us Together 🫂❤️</h1>
    <p>Open the gift to see our memories 💛</p>

    <!-- Photo 1 -->
    <div class="photo-card" onclick="openPhoto(this)">
        <img src="uday4.jpeg" alt="Our memory 1">

        <div class="photo-cover">
            <span>🎁</span>
            Our Memory ❤️
        </div>

        <div class="gift-lid">🎀</div>
    </div>

    <!-- Photo 2 -->
    <div class="photo-card" onclick="openPhoto(this)">
        <img src="uday3 fi.jpeg" alt="Our memory 2">

        <div class="photo-cover">
            <span>🎁</span>
            Our Memory 💖
        </div>

        <div class="gift-lid">🎀</div>
    </div>

    <!-- Photo 3 -->
    <div class="photo-card" onclick="openPhoto(this)">
        <img src="uday1.jpeg" alt="Our memory 3">

        <div class="photo-cover">
            <span>🎁</span>
            Our Memory 🫂
        </div>

        <div class="gift-lid">🎀</div>
    </div>

    <!-- Photo 4 -->
    <div class="photo-card" onclick="openPhoto(this)">
        <img src="uday.jpeg" alt="Our memory 4">

        <div class="photo-cover">
            <span>🎁</span>
            Our Memory ❤️
        </div>

        <div class="gift-lid">🎀</div>
    </div>

    <script>
        function openPhoto(card) {
            card.classList.add("opened");
        }
    </script>

</body>
</html>
